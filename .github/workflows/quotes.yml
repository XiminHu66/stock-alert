name: Refresh Quotes

on:
  push:
    branches: [main]
    paths:
      - scripts/fetch_quotes.py
      - requirements.txt
      - .github/workflows/quotes.yml
  schedule:
    # Best-effort five-minute quotes around US market hours.
    - cron: "*/5 13-23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-alert-data
  cancel-in-progress: false

jobs:
  refresh-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch five-minute quotes
        run: python scripts/fetch_quotes.py
      - name: Commit refreshed quotes
        run: |
          git config user.name "stock-alert-bot"
          git config user.email "stock-alert-bot@users.noreply.github.com"
          git add -- data/quotes.json
          if git diff --cached --quiet; then
            echo "No quote changes"
          else
            git commit -m "data: refresh five-minute quotes"
            git pull --rebase origin main
            git push
          fi
