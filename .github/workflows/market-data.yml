name: Refresh Market Data

on:
  push:
    branches: [main]
    paths:
      - scripts/fetch_market.py
      - requirements.txt
      - .github/workflows/market-data.yml
  schedule:
    # Every 15 minutes around US market hours. Scheduled runs may start late.
    - cron: "*/15 13-23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch quotes, news and options
        run: python scripts/fetch_market.py
      - name: Commit refreshed snapshot
        run: |
          git config user.name "stock-alert-bot"
          git config user.email "stock-alert-bot@users.noreply.github.com"
          git add -- data/market.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh market snapshot"
            git push
          fi
