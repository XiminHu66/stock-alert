name: Deploy Stock Alert to Pages
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure Pages
      uses: actions/configure-pages@v5
    - name: Prepare frontend-only client
      run: python3 .github/scripts/build_static_client.py
    - name: Upload site
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site
        retention-days: 1
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v5
    timeout-minutes: 15
